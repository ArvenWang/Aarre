<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aarre 宣传视频画面</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body,
      main,
      img {
        width: 1280px;
        height: 800px;
        margin: 0;
      }

      body {
        overflow: hidden;
        background: #f4f3ee;
        font-family:
          Inter, "SF Pro Display", "PingFang SC", "Microsoft YaHei",
          sans-serif;
      }

      main {
        position: relative;
      }

      img {
        display: block;
        object-fit: contain;
      }

      footer {
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        min-height: 120px;
        padding: 33px 64px 28px;
        color: #fff;
        background: rgba(18, 18, 17, 0.9);
      }

      footer strong {
        display: block;
        font-size: 35px;
        line-height: 1.4;
        letter-spacing: -0.03em;
      }

      footer span {
        position: absolute;
        right: 64px;
        top: 45px;
        color: #dbe8b0;
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 0.12em;
      }
    </style>
  </head>
  <body>
    <main>
      <img id="screen" alt="" />
      <footer>
        <strong id="caption"></strong>
        <span>AARRE</span>
      </footer>
    </main>
    <script>
      const frames = {
        search: {
          image: "screenshots/00-search.jpg",
          caption: "输入即搜：中文、拼音、摘要与标签都在本地命中"
        },
        organize: {
          image: "screenshots/01-organize.jpg",
          caption: "整理先预览：删除默认不选，整批操作可撤销"
        },
        report: {
          image: "screenshots/02-report.jpg",
          caption: "周报不报流水账：看见注意力迁移、知识缺口与健康度"
        },
        topics: {
          image: "screenshots/03-topics.jpg",
          caption: "主题图谱与旧藏重现：让书签从仓库变成知识入口"
        }
      };
      const key = new URLSearchParams(location.search).get("frame") || "search";
      const frame = frames[key] || frames.search;
      document.querySelector("#screen").src = frame.image;
      document.querySelector("#caption").textContent = frame.caption;
    </script>
  </body>
</html>
