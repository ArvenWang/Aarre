<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aarre 商店小型宣传图</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 440px;
        height: 280px;
        margin: 0;
        overflow: hidden;
      }

      body {
        position: relative;
        padding: 34px 38px;
        color: #171716;
        background:
          radial-gradient(circle at 82% 18%, #dce9b2 0 9%, transparent 9.5%),
          linear-gradient(135deg, #faf9f5 0%, #f0efe9 100%);
        font-family:
          Inter, "SF Pro Display", "PingFang SC", "Microsoft YaHei",
          sans-serif;
      }

      body::before {
        position: absolute;
        right: -45px;
        bottom: -42px;
        width: 210px;
        height: 150px;
        border: 2px solid rgba(23, 23, 22, 0.12);
        border-radius: 48% 52% 42% 58%;
        content: "";
        transform: rotate(-12deg);
      }

      header {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      img {
        width: 48px;
        height: 48px;
        border-radius: 13px;
      }

      .wordmark {
        display: grid;
        gap: 2px;
      }

      .wordmark strong {
        font-size: 20px;
        letter-spacing: 0.12em;
      }

      .wordmark span {
        color: #6f6f68;
        font-size: 10px;
        letter-spacing: 0.08em;
      }

      h1 {
        max-width: 330px;
        margin: 26px 0 10px;
        font-size: 30px;
        line-height: 1.1;
        letter-spacing: -0.04em;
      }

      p {
        max-width: 315px;
        margin: 0;
        color: #575751;
        font-size: 13px;
        line-height: 1.6;
      }

      .badge {
        position: absolute;
        right: 34px;
        bottom: 28px;
        padding: 8px 12px;
        border-radius: 999px;
        color: #eef7d6;
        background: #1f201e;
        font-size: 10px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <header>
      <img src="/icons/icon-128.png" alt="" />
      <div class="wordmark">
        <strong>AARRE</strong>
        <span>CHROME BOOKMARK INTELLIGENCE</span>
      </div>
    </header>
    <h1>让原生书签真正<br />找得到、理得清。</h1>
    <p>本地检索 · 可撤销整理 · 知识洞察</p>
    <span class="badge">LOCAL FIRST</span>
  </body>
</html>
