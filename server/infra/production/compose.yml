name: aarre-production

services:
  aarre-api:
    build:
      context: ../..
      dockerfile: Dockerfile
    env_file:
      - /etc/aarre/aarre.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8788
    networks:
      - nexvoice-production
    ports:
      - "127.0.0.1:8788:8788"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 320m
    cpus: 0.75

  aarre-backup:
    profiles: ["maintenance"]
    build:
      context: ../..
      dockerfile: Dockerfile
    env_file:
      - /etc/aarre/aarre.env
      - /etc/aarre/backup.env
    environment:
      NODE_ENV: production
    command: ["node", "dist/cli/backup.js"]
    networks:
      - nexvoice-production
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5

  aarre-deletion-worker:
    profiles: ["maintenance"]
    build:
      context: ../..
      dockerfile: Dockerfile
    env_file:
      - /etc/aarre/aarre.env
      - /etc/aarre/backup.env
    environment:
      NODE_ENV: production
    command: ["node", "dist/cli/process-deletions.js"]
    networks:
      - nexvoice-production
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    mem_limit: 192m
    cpus: 0.35

networks:
  nexvoice-production:
    external: true
    name: production_default
